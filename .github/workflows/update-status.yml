name: Sync GitHub Status

on:
  schedule:
    - cron: "*/30 * * * *"   # checks every 30 minutes
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  sync-status:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run status sync script
        env:
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
        run: node scripts/update-status.js

      - name: Commit changes if status changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: sync GitHub status"
          git push